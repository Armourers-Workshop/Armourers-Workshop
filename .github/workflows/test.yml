name: Build

on:
  push:
    branches:
      - develop

jobs:
  build:
    strategy:
      matrix:
        version: [ '1.16.5', '1.18.2', '1.19.2', '1.20.1', '1.21.1', '1.26.1' ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up gradle from cache
        uses: actions/cache@v4
        with:
          key: build-cache-${{ matrix.version }}
          path: |
            .gradle
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Switch ${{ matrix.version }}
        run: ./gradlew -p "versions/${{ matrix.version }}"

      - name: Build ${{ matrix.version }}
        run: ./gradlew build

      - name: Test ${{ matrix.version }}
        run: ./gradlew runServerTest
