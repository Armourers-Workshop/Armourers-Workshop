name: Build

on:
  push:
    branches:
      - develop

jobs:
  build:
    strategy:
      matrix:
        version: [ '1.16.5', '1.18.2', '1.19.2', '1.20.1', '1.21.1', '1.26.1' ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup gradle from cache
        uses: actions/cache@v4
        with:
          key: build-cache-${{ matrix.version }}
          path: |
            .gradle
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Switch to ${{ matrix.version }}
        run: ./gradlew -p "versions/${{ matrix.version }}"

      - name: Configure Project
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: ./gradlew configureLaunch configureClientLaunch

      - name: Build Project
        run: ./gradlew build

      - name: Run Server Test
        run: ./gradlew runServerTest

      - name: Run Client Test
        uses: GabrielBB/xvfb-action@v1
        with:
          run: ./gradlew runClientTest
          working-directory: ./
