name: Build

on:
  push:
    branches:
      - develop

jobs:
  build:
    needs: init
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ '16.5', '18.2', '19.2', '20.1', '21.1' ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup environment
        id: setup-env
        run: ./scripts/setup.sh >> "$GITHUB_OUTPUT"

      - name: Setup cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.setup-env.outputs.cache_key }}
          path: ${{ steps.setup-env.outputs.cache_path }}

      - name: Switch to ${{ matrix.version }}
        run: ./gradlew -p "versions/${{ matrix.version }}"

      - name: Build project
        run: ./gradlew build

      - name: Run server test
        run: ./gradlew runServerTest

  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup environment
        id: setup-env
        run: ./scripts/setup.sh >> "$GITHUB_OUTPUT"

      - name: Setup cache
        id: setup-cache
        uses: actions/cache@v4
        with:
          key: ${{ steps.setup-env.outputs.cache_key }}
          path: ${{ steps.setup-env.outputs.cache_path }}
          lookup-only: true

      - name: Generate cache
        if: ${{ steps.setup-cache.outputs.cache-hit != 'true' }}
        run: ./scripts/generate.sh
