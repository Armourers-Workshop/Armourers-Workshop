name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    strategy:
      matrix:
        version: [ '1.16.5', '1.18.2', '1.19.2', '1.20.1', '1.21.1' ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup gradle from cache
        uses: actions/cache/restore@v4
        with:
          key: build-cache-${{ matrix.version }}
          path: |
            .gradle
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Setup release version
        id: release-version
        run: |
          version=$(echo ${{ github.event.release.tag_name }} | cut -d'v' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Switch ${{ matrix.version }}
        run: ./gradlew -Pversion=${{ steps.release-version.outputs.version }} -p "versions/${{ matrix.version }}"

      - name: Build ${{ matrix.version }}
        run: ./gradlew -Pversion=${{ steps.release-version.outputs.version }} build
        env:
          AW_SIGN_ALIAS: ${{ secrets.AW_SIGN_ALIAS }}
          AW_SIGN_KEY_PASS: ${{ secrets.AW_SIGN_KEY_PASS }}
          AW_SIGN_STORE: ${{ secrets.AW_SIGN_STORE }}
          AW_SIGN_STORE_PASS: ${{ secrets.AW_SIGN_STORE_PASS }}

      - name: Upload Fabric ${{ matrix.version }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: armourersworkshop-fabric-${{ matrix.version }}-${{ steps.release-version.outputs.version }}
          version: fabric-${{ matrix.version }}-${{ steps.release-version.outputs.version }}
          version-type: beta
          #version-type: release

          files: fabric/build/libs/!(*-@(dev-shadow|sources|javadoc|)).jar

          game-versions: ${{ matrix.version }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          modrinth-id: y4JF3gXL
          modrinth-token: ${{ secrets.AW_MODRINTH_TOKEN }}

          curseforge-id: 229523
          curseforge-token: ${{ secrets.AW_CURSEFORGE_TOKEN }}

          retry-attempts: 6
          retry-delay: 30000
          fail-mode: warn

      - name: Upload Forge ${{ matrix.version }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: armourersworkshop-forge-${{ matrix.version }}-${{ steps.release-version.outputs.version }}
          version: forge-${{ matrix.version }}-${{ steps.release-version.outputs.version }}
          version-type: beta

          files: forge/build/libs/!(*-@(dev-shadow|sources|javadoc)).jar

          game-versions: ${{ matrix.version }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          modrinth-id: y4JF3gXL
          modrinth-token: ${{ secrets.AW_MODRINTH_TOKEN }}

          curseforge-id: 229523
          curseforge-token: ${{ secrets.AW_CURSEFORGE_TOKEN }}

          retry-attempts: 6
          retry-delay: 30000
          fail-mode: warn
